// ==UserScript==
// @ScriptName        小黄鱼净化[稳定优化版]
// @Author            @ddgksf2013; optimized by AWelook
// @Function          移除闲鱼开屏、首页、搜索、我的页面及推荐广告
// @Upstream          https://raw.githubusercontent.com/ddgksf2013/Rewrite/refs/heads/master/AdBlock/GoofishAds.conf
// @UpdateTime        2026-07-26
// @Suitable          Quantumult X
// @Attention         使用前请卸载闲鱼，挂载脚本然后使用
// @Attention         原始规则和脚本版权归原作者所有，引用请注明出处
// @Version           V1.0.11-opt.1
// @ScriptURL         https://raw.githubusercontent.com/AWelook/Surge-Modules-Optimized/refs/heads/main/modules/ad/goofish-ads.conf
// ==/UserScript==
hostname = acs.m.goofish.com, g-acs.m.goofish.com

host-suffix,iyes.youku.com,reject
# > 开屏广告@ddgksf2013
^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop.*splash\.ads url reject-200
# > 首页右下角悬浮球@ddgksf2013
^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop.taobao.idle.user.strategy.list url jsonjq-response-body '.data.strategies = [{}]'
# > 开屏通用广告@ddgksf2013
^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop.idle.ad.expose url reject-200
# > 首页顶部Tab@ddgksf2013
^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop.taobao.idlehome.home.circle.list url jsonjq-response-body 'if (.data.circleList? | type) == "array" then .data.circleList |= map(select(.bizCode? != "saveMoney")) else . end'
# > 首页信息流@ddgksf2013
^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop.taobao.idlehome.home.nextfresh url jsonjq-response-body 'if (.data.homeTopList? | type) == "array" then .data.homeTopList |= .[0:1] else . end | if (.data.sections? | type) == "array" then .data.sections |= map(select(.data.bizType? == "item")) else . end'
# > 搜索填词@ddgksf2013
^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop.taobao.idlemtopsearch.search.shade url jsonjq-response-body '.data.singleShadeWords = [{}]'
# > 猜你可能找@ddgksf2013
^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop.taobao.idlemtopsearch.item.search.activate url jsonjq-response-body '.data.cardList = [{}]'
# > 搜索发现@ddgksf2013
^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop.taobao.idlemtopsearch.search.discover url jsonjq-response-body 'del(.data.resultList)'
# > 我的页面@ddgksf2013
^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop.idle.user.page.my.adapter url jsonjq-response-body '.data.ability = [] | if (.data.container.sections? | type) == "array" then .data.container.sections |= map(select((.sectionBizCode? | type) == "string" and (.sectionBizCode | test("head|user|trade")))) else . end'
# > 我的页面信息流处理@ddgksf2013
^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop.taobao.idle.item.buy.feeds url jsonjq-response-body 'del(.data.sections)'
# > 本地信息流AD@ddgksf2013
^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop.taobao.idle.local.home url jsonjq-response-body 'if (.data.sections? | type) == "array" then .data.sections |= map(select(.data.bizType? == "item")) else . end'
# > 搜索结果信息流AD@ddgksf2013
^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop.taobao.idlemtopsearch.search url jsonjq-response-body 'if (.data.resultList? | type) == "array" then .data.resultList |= map(select(.data.item.main.clickParam.args.biz_type? == "item")) else . end'
# > 商品底部推荐商品信息流AD@ddgksf2013
^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop.taobao.idle.item.recommend url jsonjq-response-body 'if (.data.cardList? | type) == "array" then .data.cardList |= map(select(.cardData.bizType? != "mamaAD")) else . end'
# > AMDC处理@ddgksf2013
^http:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,4}(:\d+)?\/amdc\/mobileDispatch url script-response-body https://raw.githubusercontent.com/AWelook/Surge-Modules-Optimized/refs/heads/main/scripts/ad/goofish-ads/amdc.js

