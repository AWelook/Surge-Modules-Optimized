name: Sync upstream snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream-snapshots
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SCRIPT_HUB_IMAGE: xream/script-hub@sha256:c55180dd41c07567906f17953587c25b61b427b2c5cc6b955721677fd615f470
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Start pinned Script Hub service
        shell: bash
        run: |
          docker run \
            --detach \
            --rm \
            --name script-hub \
            --publish 127.0.0.1:9100:9100 \
            --env HOST=0.0.0.0 \
            --env PORT=9100 \
            "$SCRIPT_HUB_IMAGE"

          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null \
              http://127.0.0.1:9100/; then
              exit 0
            fi
            sleep 1
          done

          docker logs script-hub
          echo "Script Hub did not become ready."
          exit 1

      - name: Download registered upstream files
        shell: bash
        run: |
          npm run sync -- \
            --failures-file "$RUNNER_TEMP/upstream-sync-failures.json"

      - name: Convert registered non-Surge sources
        env:
          SCRIPT_HUB_ENDPOINT: http://127.0.0.1:9100
        run: npm run convert

      - name: Report retained upstream snapshots
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          label="upstream-sync-failure"
          failures_file="${RUNNER_TEMP}/upstream-sync-failures.json"
          gh label create "$label" \
            --repo "$GITHUB_REPOSITORY" \
            --color B60205 \
            --description "上游源不可访问，当前保留已验证快照" \
            --force

          while IFS= read -r project; do
            [[ -z "$project" ]] && continue
            title="上游同步受阻：${project}"
            issue_number="$(
              gh issue list \
                --repo "$GITHUB_REPOSITORY" \
                --state open \
                --label "$label" \
                --limit 100 \
                --json number,title \
                --jq ".[] | select(.title == \"${title}\") | .number" |
                head -n 1
            )"
            failure="$(
              jq -c \
                --arg project "$project" \
                '.[] | select((.category + "/" + .slug) == $project)' \
                "$failures_file"
            )"

            if [[ -n "$failure" ]]; then
              body_file="${RUNNER_TEMP}/sync-failure-${project//\//-}.md"
              {
                echo "GitHub Runner 无法访问登记项目 \`${project}\` 的上游源。"
                echo
                echo "本次没有覆盖该项目，继续使用仓库内已验证的原始快照和转换快照；其他项目仍正常同步。"
                echo
                echo "错误：\`$(jq -r '.message' <<< "$failure")\`"
                echo
                echo "工作流：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              } > "$body_file"

              if [[ -n "$issue_number" ]]; then
                gh issue edit "$issue_number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --body-file "$body_file"
              else
                gh issue create \
                  --repo "$GITHUB_REPOSITORY" \
                  --title "$title" \
                  --label "$label" \
                  --body-file "$body_file"
              fi
            elif [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --body "上游访问已恢复，自动同步成功。"
              gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY"
            fi
          done < <(
            node -e '
              const registry = require("./registry.json");
              for (const entry of registry) {
                if (entry.sync?.retainExistingOnFailure) {
                  console.log(`${entry.category}/${entry.slug}`);
                }
              }
            '
          )

      - name: Detect upstream changes
        id: changes
        shell: bash
        run: |
          change_file="${RUNNER_TEMP}/upstream-changes.txt"
          projects_file="${RUNNER_TEMP}/changed-projects.txt"
          if git diff --quiet --exit-code && [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            : > "$change_file"
            : > "$projects_file"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              git status --short
              git diff --stat
            } > "$change_file"
            git status --porcelain |
              awk '$2 ~ /^(upstream|converted)\// { split($2, path, "/"); print path[2] "/" path[3] }' |
              sort -u > "$projects_file"
            if [[ ! -s "$projects_file" ]]; then
              node -e '
                const registry = require("./registry.json");
                for (const entry of registry) {
                  console.log(`${entry.category}/${entry.slug}`);
                }
              ' > "$projects_file"
            fi
          fi

      - name: Validate published files
        id: validation
        continue-on-error: true
        run: npm test

      - name: Commit snapshot changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream converted registry.json
          git commit -m "Sync upstream snapshots"
          git push

      - name: Open or update upstream optimization issue
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          label="upstream-update"
          gh label create "$label" \
            --repo "$GITHUB_REPOSITORY" \
            --color D93F0B \
            --description "上游已变化，等待重新转换、审核和优化" \
            --force

          while IFS= read -r project; do
            [[ -z "$project" ]] && continue
            title="上游更新待优化：${project}"
            body_file="${RUNNER_TEMP}/upstream-issue-${project//\//-}.md"
            {
              echo "检测到登记项目 \`${project}\` 的上游模块或脚本发生变化。"
              echo
              echo "请按以下流程处理：识别来源格式 → 必要时用 Script Hub 转换 → 差异分析 → 保功能优化 → 若属于合集来源则重建合集 → 测试 → 更新发布文件。"
              echo
              echo '```text'
              grep -F "upstream/${project}/" "${RUNNER_TEMP}/upstream-changes.txt" || true
              grep -F "converted/${project}/" "${RUNNER_TEMP}/upstream-changes.txt" || true
              grep -F "registry.json" "${RUNNER_TEMP}/upstream-changes.txt" || true
              echo '```'
              echo
              echo "同步提交：$(git rev-parse HEAD)"
              echo "同步后测试：${{ steps.validation.outcome }}"
              echo "工作流：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > "$body_file"

            issue_number="$(
              gh issue list \
                --repo "$GITHUB_REPOSITORY" \
                --state open \
                --label "$label" \
                --limit 100 \
                --json number,title \
                --jq ".[] | select(.title == \"${title}\") | .number" |
                head -n 1
            )"

            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --body-file "$body_file"
            else
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$title" \
                --label "$label" \
                --body-file "$body_file"
            fi
          done < "${RUNNER_TEMP}/changed-projects.txt"

      - name: Report validation failure
        if: steps.validation.outcome == 'failure'
        run: |
          echo "Published-file validation failed; the upstream snapshot and optimization task were still recorded."
          exit 1

      - name: Report Script Hub logs
        if: failure()
        run: docker logs script-hub || true

      - name: Stop Script Hub service
        if: always()
        run: docker stop script-hub || true
